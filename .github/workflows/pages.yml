name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and test deck
        run: |
          python3 -B build.py
          python3 -B test_deck.py
      - name: Assemble public site (speaker notes removed)
        run: |
          mkdir -p public/portraits
          cp deck.css deck.js public/
          cp portraits/patrick.jpeg public/portraits/
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          pattern = r'(<aside class="speaker-notes"[^>]*>).*?(</aside>)'
          html, count = re.subn(pattern, r'\1\2', html, flags=re.S)
          assert count > 0, 'no speaker notes found'
          assert 'note-sources' not in html and 'note-meta' not in html
          Path('public/index.html').write_text(html, encoding='utf-8')
          print(f'Removed content of {count} speaker-note blocks')
          PY
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
